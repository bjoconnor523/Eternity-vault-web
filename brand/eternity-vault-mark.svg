<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Eternity Vault mark: shaded yellow globe, blue dotted route rim-to-rim,
       solid blue heart where the route crosses. Approved by Brandon 2026-07-15. -->
  <defs>
    <radialGradient id="evGlobe" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFE28F"/>
      <stop offset="55%" stop-color="#FFC93C"/>
      <stop offset="100%" stop-color="#DC9E18"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="38" fill="url(#evGlobe)"/>
  <path d="M13 57 Q 30 66 50 58.6 M50 58.6 Q 70 66 87 57" fill="none"
        stroke="#1B4B8F" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
  <!-- 11th dot: continues the route's rhythm to the right rim -->
  <path d="M86.56 57.23 L87.44 56.77" fill="none"
        stroke="#1B4B8F" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 58.6 C 45.2 54.6 40.4 52.2 40.4 47.4 C 40.4 41.8 45.2 39.4 50 48.2 C 54.8 39.4 59.6 41.8 59.6 47.4 C 59.6 52.2 54.8 54.6 50 58.6 Z"
        fill="#1B4B8F"/>
</svg>
